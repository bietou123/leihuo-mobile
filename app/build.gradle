plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leihuo.chat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leihuo.chat'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            def signingPath = System.getenv('LEIHUO_SIGNING_FILE')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('LEIHUO_SIGNING_PASSWORD')
                keyAlias 'leihuo'
                keyPassword System.getenv('LEIHUO_SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
